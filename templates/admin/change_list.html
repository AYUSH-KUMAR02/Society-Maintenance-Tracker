{% extends "admin/change_list.html" %}
{% block object-tools %}
    {% if metrics %}
    <div style="display: flex; gap: 20px; margin-bottom: 20px; background: #f4f4f5; padding: 15px; border-radius: 8px;">
        <div style="flex:1; text-align: center;"><strong>🟢 Open</strong><br><span style="font-size: 1.5rem;">{{ metrics.Open }}</span></div>
        <div style="flex:1; text-align: center;"><strong>🟡 In Progress</strong><br><span style="font-size: 1.5rem;">{{ metrics.In_Progress }}</span></div>
        <div style="flex:1; text-align: center;"><strong>🔵 Resolved</strong><br><span style="font-size: 1.5rem;">{{ metrics.Resolved }}</span></div>
        <div style="flex:1; text-align: center; color: red;"><strong>🔴 Overdue</strong><br><span style="font-size: 1.5rem;">{{ metrics.Overdue }}</span></div>
    </div>
    {% endif %}
    {{ block.super }}
{% endblock %}
