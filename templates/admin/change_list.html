{% extends "admin/change_list.html" %}
{% block object-tools %}
    {% if metrics %}
    <div style="display: flex; gap: 20px; margin-bottom: 25px; background: var(--body-bg, #f4f4f5); padding: 20px; border-radius: 8px; border: 1px solid #ddd; font-family: sans-serif;">
        <!-- Open Stat -->
        <div style="flex:1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
                <span style="width: 12px; height: 12px; background-color: #28a745; border-radius: 50%; display: inline-block; box-shadow: 0 0 4px #28a745;"></span>
                <strong style="color: #333;">Open</strong>
            </div>
            <span style="font-size: 1.8rem; font-weight: bold; color: #28a745;">{{ metrics.Open }}</span>
        </div>
        
        <!-- In Progress Stat -->
        <div style="flex:1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
                <span style="width: 12px; height: 12px; background-color: #ffc107; border-radius: 50%; display: inline-block; box-shadow: 0 0 4px #ffc107;"></span>
                <strong style="color: #333;">In Progress</strong>
            </div>
            <span style="font-size: 1.8rem; font-weight: bold; color: #b78a00;">{{ metrics.In_Progress }}</span>
        </div>
        
        <!-- Resolved Stat -->
        <div style="flex:1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
                <span style="width: 12px; height: 12px; background-color: #007bff; border-radius: 50%; display: inline-block; box-shadow: 0 0 4px #007bff;"></span>
                <strong style="color: #333;">Resolved</strong>
            </div>
            <span style="font-size: 1.8rem; font-weight: bold; color: #007bff;">{{ metrics.Resolved }}</span>
        </div>
        
        <!-- Overdue Stat -->
        <div style="flex:1; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
                <span style="width: 12px; height: 12px; background-color: #dc3545; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px #dc3545;"></span>
                <strong style="color: #dc3545;">Overdue</strong>
            </div>
            <span style="font-size: 1.8rem; font-weight: bold; color: #dc3545;">{{ metrics.Overdue }}</span>
        </div>
    </div>
    {% endif %}
    {{ block.super }}
{% endblock %}
